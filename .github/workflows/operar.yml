# Comando do operador (docs/19 §6; issue #107): criar um comerciante no
# ensaio, a primeira chave de servidor dele, ou o convite do primeiro dono
# (§6.0; issue #156). Lança-se à mão (ADR-0028: a
# VPS opera-se pelo GitHub). Só quem pode escrever no repositório o lança, e
# o ambiente «ensaio» só aceita o main.
#
# A chave: corre-se primeiro, NO PRÓPRIO COMPUTADOR,
#   node apps/api/scripts/gerar-chave.mjs
# e guarda-se o segredo num cofre. Aqui põe-se só o prefixo e o resumo: o
# segredo nunca passa pelo GitHub nem pela VPS.
#
# O convite: corre-se primeiro, NO PRÓPRIO COMPUTADOR,
#   node apps/api/scripts/gerar-convite.mjs
# e dá-se a ligação (com o segredo) a quem vai ser dono. Aqui põe-se só o
# resumo e um e-mail FICTÍCIO de um domínio reservado para testes (ex.:
# dono@loja.test): o ensaio não recebe dados pessoais (ADR-0019) e as
# entradas ficam no histórico do GitHub.
#
# Na VPS, antes de escrever, faz-se uma cópia da base (AGENTS.md, «Operar a
# VPS», regra 2). Quem lançou fica na chave como `operador:github:<número>`.
name: operar

on:
  workflow_dispatch:
    inputs:
      accao:
        description: "O que fazer"
        type: choice
        options: [comerciante, chave, convite]
        required: true
      nome:
        description: "Nome do comerciante (SÓ DE ENSAIO, fictício: a VPS do ensaio não recebe dados reais) ou da chave; até 100 caracteres sem acentos, menos com acentos. No convite não se usa"
        type: string
        default: ""
      lingua:
        description: "Comerciante: língua (duas letras)"
        type: string
        default: pt
      fuso:
        description: "Comerciante: fuso horário IANA"
        type: string
        default: Europe/Lisbon
      comerciante:
        description: "Chave e convite: o comerciante (mer_… ou o uuid)"
        type: string
        default: ""
      ambitos:
        description: "Chave: âmbitos separados por vírgulas"
        type: string
        default: "keys:write,merchant:read,catalog:read"
      prefixo:
        description: "Chave: o prefixo dado pelo gerar-chave.mjs"
        type: string
        default: ""
      resumo:
        description: "Chave ou convite: o resumo dado pelo gerar-chave.mjs ou pelo gerar-convite.mjs (nunca o segredo nem a ligação)"
        type: string
        default: ""
      email:
        description: "Convite: e-mail FICTÍCIO do primeiro dono, de um domínio reservado para testes (.test, .example, .invalid, example.com/net/org)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: operar-ensaio
  cancel-in-progress: false

jobs:
  operar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ensaio
    steps:
      - name: Montar o pedido
        id: pedido
        # As entradas vão por variáveis de ambiente, nunca escritas no script
        # (sem injecção). A VPS valida outra vez. O GitHub mostra o bloco env
        # no registo da execução, sem esconder nada (medido a 08/10/2026):
        # um segredo colado num campo fica lá, e a execução tem de ser
        # apagada (revisão do #172, P2-2).
        env:
          ACCAO: ${{ inputs.accao }}
          NOME: ${{ inputs.nome }}
          LINGUA: ${{ inputs.lingua }}
          FUSO: ${{ inputs.fuso }}
          COMERCIANTE: ${{ inputs.comerciante }}
          AMBITOS: ${{ inputs.ambitos }}
          PREFIXO: ${{ inputs.prefixo }}
          RESUMO: ${{ inputs.resumo }}
          EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          # Nenhuma entrada pode trazer um segredo nem quebras de linha
          # (revisão do #110, P2-4 e P3-4).
          for valor in "$ACCAO" "$NOME" "$LINGUA" "$FUSO" "$COMERCIANTE" "$AMBITOS" "$PREFIXO" "$RESUMO" "$EMAIL"; do
            if [[ "$valor" =~ eul_(sk|pk)_[a-z2-7]{6,} ]]; then
              echo "Uma das entradas tem um SEGREDO de chave: APAGA esta execução do fluxo no GitHub (as entradas ficam no registo dela) e gera outra chave com o gerar-chave.mjs; esta não se usa." >&2
              exit 1
            fi
            if [[ "$valor" == *euc_* ]]; then
              echo "Uma das entradas tem o SEGREDO de um convite: APAGA esta execução do fluxo no GitHub (as entradas ficam no registo dela) e gera outra ligação com o gerar-convite.mjs; esta não se usa." >&2
              exit 1
            fi
            if [[ "$valor" =~ [[:cntrl:]] ]]; then
              echo "Uma das entradas tem quebras de linha ou outros caracteres de controlo: recusado." >&2
              exit 1
            fi
          done
          nome64="$(printf '%s' "$NOME" | basenc --base64url -w0 | tr -d '=')"
          quem="github:${GITHUB_ACTOR_ID}"
          # Cada acção confere aqui os campos dela e diz o que falta, antes de
          # ir à VPS, que só respondia «pedido recusado» (dois enganos no
          # primeiro ensaio, 08/10/2026). A VPS valida outra vez.
          recusar() { echo "Acção «${ACCAO}»: $*" >&2; exit 1; }
          # Nunca se repete o valor recebido: só o tamanho (revisão do #172,
          # P3-3).
          tem_texto() { [[ "$1" =~ [^[:space:]] ]]; }
          nome_valido() {
            tem_texto "$NOME" || recusar "$1"
            # O lerPedido aceita até 100 caracteres; a VPS, até 200 em base64url.
            ((${#nome64} <= 200)) && ((${#NOME} <= 100)) ||
              recusar "o nome tem no máximo 100 caracteres (menos com acentos)."
          }
          uuid_re='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          comerciante_valido() {
            comerciante="${COMERCIANTE#mer_}"
            [[ "$comerciante" =~ $uuid_re ]] ||
              recusar "o comerciante é o mer_… (ou só o uuid) devolvido pela acção «comerciante», sem espaços nem outros caracteres (recebidos ${#COMERCIANTE} caracteres)."
          }
          resumo_valido() {
            [[ "$RESUMO" =~ ^[0-9a-f]{64}$ ]] ||
              recusar "o resumo tem de ser a linha de 64 letras e algarismos que o $1 mostra (recebido: ${#RESUMO} caracteres)."
          }
          echo "Acção: ${ACCAO}."
          case "$ACCAO" in
            comerciante)
              nome_valido "falta o nome do comerciante (fictício). Se querias um convite, escolhe «convite» em «O que fazer»."
              [[ "$LINGUA" =~ ^[a-z]{2}$ ]] || recusar "a língua tem duas letras minúsculas (ex.: pt)."
              [[ "$FUSO" =~ ^[A-Za-z_]+(/[A-Za-z0-9_+-]+){0,2}$ ]] ||
                recusar "o fuso horário é um nome IANA (ex.: Europe/Lisbon)."
              # O número da execução não muda num «Re-run»: repetir
              # devolve o mesmo comerciante (migração 0045; #107).
              pedido="comerciante ${LINGUA} ${FUSO} ${nome64} run:${GITHUB_RUN_ID} ${quem}"
              ;;
            chave)
              nome_valido "falta o nome da chave."
              comerciante_valido
              # Os âmbitos de servidor de src/identidade/chaves.ts (sem
              # storefront); têm de acompanhar essa lista (revisão do #172,
              # P3-2).
              ambitos="${AMBITOS// /}"
              [[ -n "$ambitos" ]] || recusar "faltam os âmbitos."
              IFS=, read -r -a lista <<<"$ambitos"
              for ambito in "${lista[@]}"; do
                case "$ambito" in
                  merchant:read | merchant:write | catalog:read | catalog:write | catalog:publish | catalog:import | keys:write) ;;
                  *) recusar "âmbito desconhecido: «${ambito}» (os de servidor: merchant:read, merchant:write, catalog:read, catalog:write, catalog:publish, catalog:import, keys:write)." ;;
                esac
              done
              [[ "$PREFIXO" =~ ^eul_sk_[a-z2-7]{5}$ ]] || recusar "o prefixo é o que o gerar-chave.mjs mostra (eul_sk_ e 5 caracteres)."
              resumo_valido gerar-chave.mjs
              pedido="chave ${comerciante} ${ambitos} ${PREFIXO} ${RESUMO} ${nome64} ${quem}"
              ;;
            convite)
              # Só domínios reservados para testes (RFC 2606 e 6761): o
              # ensaio não recebe dados pessoais (ADR-0019; docs/19 §6.0).
              # Recusa em vez de limpar: o que se grava é o que se escreveu
              # (revisão do #165, P3-2); só as maiúsculas passam a minúsculas.
              comerciante_valido
              resumo_valido gerar-convite.mjs
              [[ -n "$EMAIL" ]] || recusar "falta o e-mail fictício do primeiro dono (ex.: dono@loja.test)."
              [[ ! "$EMAIL" =~ [[:space:]] ]] || recusar "o e-mail não pode ter espaços."
              email="${EMAIL,,}"
              [[ "$email" =~ ^[^@]+@([a-z0-9-]+\.)*([a-z0-9-]+\.(test|example|invalid)|example\.(com|net|org))$ ]] ||
                recusar "o e-mail tem de ser fictício, de um domínio reservado para testes (ex.: dono@loja.test). Se escreveste um endereço REAL, apaga esta execução do fluxo no GitHub: as entradas ficam nela (docs/19 §6.0)."
              email64="$(printf '%s' "$email" | basenc --base64url -w0 | tr -d '=')"
              pedido="convite ${comerciante} ${email64} dono ${RESUMO} ${quem}"
              echo "Convite para ${email} (fictício), papel dono."
              ;;
            *) recusar "acção desconhecida." ;;
          esac
          fim="FIM_$(openssl rand -hex 16)"
          {
            echo "pedido<<$fim"
            echo "$pedido"
            echo "$fim"
          } >>"$GITHUB_OUTPUT"
      - name: Pedir à VPS
        env:
          CHAVE: ${{ secrets.VPS_CHAVE_OPERAR }}
          ANFITRIOES: ${{ vars.VPS_KNOWN_HOSTS }}
          VPS: ${{ secrets.VPS_ENDERECO }}
          PEDIDO: ${{ steps.pedido.outputs.pedido }}
        run: |
          set -euo pipefail
          [[ -n "$CHAVE" ]] || { echo "Falta o segredo VPS_CHAVE_OPERAR no ambiente ensaio." >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/chave
          chmod 600 ~/.ssh/chave
          printf '%s\n' "$ANFITRIOES" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/chave "eurolify-operar@${VPS}" "$PEDIDO"
      - name: Apagar a chave do executor
        if: always()
        run: rm -f ~/.ssh/chave
