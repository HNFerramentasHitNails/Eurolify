# Vigilância de segredos e de dependências (auditoria docs/16, segurança):
# em cada entrada no main e todas as manhãs, para apanhar também o que se
# descobre depois de juntar («uma régua corre sozinha e avisa»,
# observability-security); os segredos também em cada pedido de alteração.
# As dependências num pedido só quando ele mexe nelas (vigiar-dependencias.yml):
# um aviso novo publicado hoje não pinta de vermelho os pedidos alheios.
# Não muda o repositório. O pnpm audit envia ao registo do npm a lista de
# pacotes e versões (não são dados pessoais). Se a corrida da manhã falhar,
# abre um issue (ou acrescenta-lhe um comentário, se já estiver aberto).
# As acções de terceiros estão fixadas pelo resumo do commit (ADR-0026); o
# gitleaks descarrega-se e confere-se pelo sha256 antes de correr.
#
# Se o gitleaks encontrar um segredo: (1) revoga-se a chave primeiro
# (AGENTS.md, «Operar a VPS», regra 7); (2) o histórico não se reescreve
# (nunca push --force); (3) por pedido revisto, acrescenta-se a impressão
# digital do achado ao .gitleaksignore, a dizer que a chave foi revogada e
# quando. Um falso positivo trata-se da mesma forma, a dizer porquê.
name: vigiar

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigiar-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  segredos:
    # Todo o histórico: um segredo apagado num commit seguinte continua lá.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSAO: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: instalar o gitleaks (versão e resumo fixos)
        run: |
          f="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar xzf "${f}" gitleaks
      - name: varrer o histórico
        # --redact: o que encontrar não aparece em claro no registo do fluxo.
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  dependencias:
    # Vulnerabilidades conhecidas, de gravidade alta ou crítica, nas
    # dependências (as de produção e as de desenvolvimento, que correm no CI).
    # Provado a 05/10/2026 com o pnpm 12.9.1: o lodash 4.17.15 dá saída 1.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: pnpm audit --audit-level=high

  espelho:
    # As imagens dos fluxos vêm do mirror.gcr.io, fixadas pelo resumo
    # (memoria/ci-imagens-espelho-09out2026.md). O espelho só guarda as
    # imagens mais pedidas e pode tirar uma: confere-se todas as manhãs que
    # cada resumo ainda lá está, antes de uma publicação partir por isso
    # (revisão do #270, P2-1). Lê os resumos dos próprios ficheiros.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: conferir os resumos no espelho
        run: |
          refs="$(grep -rhoE 'mirror\.gcr\.io/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' \
            .github/workflows Dockerfile | sort -u)"
          [[ -n "$refs" ]] || { echo "Nenhuma imagem do espelho encontrada." >&2; exit 1; }
          falhou=0
          while read -r ref; do
            caminho="${ref#mirror.gcr.io/}"
            repo="${caminho%@*}"
            repo="${repo%%:*}"
            resumo="${ref##*@}"
            codigo="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://mirror.gcr.io/v2/${repo}/manifests/${resumo}")"
            echo "${codigo} ${ref}"
            [[ "$codigo" == 200 ]] || falhou=1
          done <<<"$refs"
          if ((falhou)); then
            echo "Uma imagem saiu do espelho: actualizar o resumo (e conferi-lo no espelho) num pedido." >&2
            exit 1
          fi

  imagens:
    # As imagens base fixadas pelo resumo (infra/ci/imagens-base.txt; o
    # Dockerfile repete a do node) não têm Dependabot: a etiqueta pode ganhar
    # uma imagem nova (reconstruída com correcções) e o nosso resumo fica
    # para trás. Todas as manhãs compara-se, no espelho, o resumo actual de
    # cada etiqueta com o fixado (decisão do Diogo, 10/10/2026; docs/16). Se
    # mudou, abre-se um issue (sem repetir) para se actualizar num pedido; a
    # corrida não falha por isso. Não muda o repositório.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITULO: "imagens: há uma versão nova de uma imagem base"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: comparar os resumos com os do espelho
        run: |
          novas=""
          sem_leitura=""
          while read -r nome origem; do
            [[ -z "$nome" || "$nome" == \#* ]] && continue
            ref="${origem#docker.io/}"
            repo="${ref%%:*}"
            resto="${ref#*:}"
            etiqueta="${resto%@*}"
            fixo="${resto##*@}"
            actual="$(curl -sI --max-time 20 --retry 2 \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://mirror.gcr.io/v2/${repo}/manifests/${etiqueta}" |
              tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')" || actual=""
            # Só um resumo bem formado conta (revisão do #308, P3-2).
            if [[ ! "$actual" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "não consegui ler ${repo}:${etiqueta} no espelho"
              sem_leitura+="- ${nome} (${repo}:${etiqueta})"$'\n'
            elif [[ "$actual" != "$fixo" ]]; then
              echo "${nome}: ${repo}:${etiqueta} mudou (${fixo:7:12} → ${actual:7:12})"
              novas+="- ${nome} (${repo}:${etiqueta}): fixado \`${fixo}\`, no espelho \`${actual}\`"$'\n'
            else
              echo "${nome}: igual"
            fi
          done < infra/ci/imagens-base.txt
          # Um espelho que não responde não é uma imagem nova: fica no registo
          # da corrida, sem issue (revisão do #308, P3-1).
          [[ -n "$novas" ]] || exit 0
          texto="$(printf '%s\n%s\n%s\n%s' \
            "Em $(date -u +%F), no espelho mirror.gcr.io (é o espelho que se compara, não o Docker Hub):" \
            "$novas" \
            "Actualizar num pedido de alteração: infra/ci/imagens-base.txt; no caso do node, também o Dockerfile; no caso do postgres, também infra/vps/ficheiros/ensaio.conf (IMAGEM_POSTGRES). Conferir as notas da versão e correr as verificações." \
            "${sem_leitura:+Sem leitura no espelho: }${sem_leitura}")"
          n="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | "\(.number)\t\(.title)"' |
            awk -F'\t' -v t="$TITULO" '$2 == t { print $1; exit }')"
          if [[ -z "$n" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$TITULO" -f body="$texto" >/dev/null
            exit 0
          fi
          # Com o issue aberto, só se escreve quando a lista mudou (uma imagem
          # nova a mais, ou outro resumo): um comentário com a lista de hoje
          # (revisão do #308, P2-1). Fechar o issue sem actualizar as imagens
          # faz abrir outro na manhã seguinte, de propósito.
          ja="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}" --jq .body)"
          ja+="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments?per_page=100" --jq '.[].body')"
          if [[ "$ja" != *"$novas"* ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="$texto" >/dev/null
          fi

  avisar:
    # A corrida da manhã não pára em silêncio: um issue aberto, sem repetir.
    needs: [segredos, dependencias, espelho, imagens]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITULO: "vigiar: a corrida da manhã falhou"
      CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: abrir ou actualizar o issue
        run: |
          n="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | "\(.number)\t\(.title)"' |
            awk -F'\t' -v t="$TITULO" '$2 == t { print $1; exit }')"
          texto="A corrida de $(date -u +%F) do fluxo vigiar falhou: ${CORRIDA}"
          if [[ -n "$n" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${n}/comments" -f body="$texto" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$TITULO" -f body="$texto" >/dev/null
          fi
