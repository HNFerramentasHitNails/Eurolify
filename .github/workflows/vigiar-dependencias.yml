# As dependências num pedido de alteração que mexe nelas (o resto está no
# vigiar.yml: entrada no main e todas as manhãs). Mesmo trabalho, mesma régua.
name: vigiar-dependencias

on:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"

permissions:
  contents: read

concurrency:
  group: vigiar-dependencias-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencias:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && vars.EXECUTOR_CI) || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: pnpm audit --audit-level=high
