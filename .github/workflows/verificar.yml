# Lint, tipos, testes (com PostgreSQL 18 verdadeiro) e construção, em cada
# pedido de alteração; o fluxo de publicar chama-o antes de construir a imagem.
# As acções de terceiros estão fixadas pelo resumo do commit (ADR-0026).
name: verificar

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          # Palavra-passe de uma base descartável, que só existe durante o
          # fluxo e só ouve no executor: não é um segredo.
          POSTGRES_PASSWORD: verificar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BASE_DADOS_URL: postgres://postgres:verificar@127.0.0.1:5432/postgres
      EXIGIR_BASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tipos
      - run: pnpm teste
      - run: pnpm construir

  script-vps:
    # O script da VPS (C3): shellcheck e o modo que só mostra numa máquina
    # Ubuntu 26.04 vazia. Não toca na VPS.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -x -P SCRIPTDIR \
            infra/vps/preparar.sh \
            infra/vps/ficheiros/lib/comum.sh \
            infra/vps/ficheiros/bin/eurolify-pedido \
            infra/vps/ficheiros/sbin/eurolify-* \
            infra/vps/testes/*.sh
      - name: testes do serviço da máquina num Ubuntu 26.04 vazio
        # Cada teste num contentor novo: não herdam o que o outro instalou.
        run: |
          for teste in infra/vps/testes/*.sh; do
            echo "== $teste"
            docker run --rm -e EUROLIFY_TESTE_DESCARTAVEL=1 -v "$PWD:/repo:ro" \
              ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7 \
              bash "/repo/$teste"
          done
      - name: preparar.sh --mostrar num Ubuntu 26.04 vazio
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7 \
            bash /repo/infra/vps/preparar.sh --mostrar

  imagem:
    # Prova que o Dockerfile constrói; não envia nada para lado nenhum.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
