# Lint, tipos, testes (com PostgreSQL 18 verdadeiro) e construção, em cada
# pedido de alteração; o fluxo de publicar chama-o antes de construir a imagem.
# As acções de terceiros estão fixadas pelo resumo do commit (ADR-0026).
# O executor vem da variável do repositório EXECUTOR_CI (ADR-0046) SÓ num
# pedido de alteração que não vem de um fork nem do dependabot, e só nos
# trabalhos sem segredos e com token só de leitura (verificar, vigiar,
# vigiar-dependencias, espelhar-imagens/conferir). Tudo o resto, também o
# verificar chamado pelo publicar, fica no executor do GitHub. Com
# ["self-hosted","linux","eurolify-ci"], a máquina nossa
# (infra/ci-executor/LEIA-ME.md).
name: verificar

on:
  pull_request:
    # ready_for_review: o rascunho não corre os testes; correm quando sai dele.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alteracoes:
    # Os minutos do Actions pagam-se (#471): num pedido, decide o que corre.
    # Rascunho: nada, nem este trabalho (decide-se na condição de cada um).
    # Só documentos: nada. O script da VPS, só quando muda infra/, o
    # Dockerfile ou .github/. Na dúvida (um passo que falha, uma lista vazia),
    # os trabalhos abaixo correm: só "nao" os salta (revisão do #472, P1-1).
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && vars.EXECUTOR_CI) || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      codigo: ${{ steps.ver.outputs.codigo }}
      vps: ${{ steps.ver.outputs.vps }}
    steps:
      - id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PEDIDO: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Os nomes antigos dos ficheiros mudados de sítio também contam.
          gh api --paginate "repos/$REPO/pulls/$PEDIDO/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > ficheiros.txt
          # Lista vazia: corre tudo. A API só lista 3000 ficheiros: acima
          # disso, corre tudo.
          if [ ! -s ficheiros.txt ] || [ "$(wc -l < ficheiros.txt)" -ge 3000 ]; then
            printf 'codigo=sim\nvps=sim\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # O docs/03 conta como código: o regras-temas.test.ts lê-o (#128).
          documentos='^(docs/|memoria/|\.agents/|\.claude/)|^[^/]+\.md$'
          # O grep sai com 1 quando não encontra e com 2 num erro: só o 1
          # dá "nao".
          codigo=sim
          if ! grep -qxF docs/03-regulamentar-ue.md ficheiros.txt; then
            r=0
            grep -qvE "$documentos" ficheiros.txt || r=$?
            if [ "$r" -eq 1 ]; then
              echo "Só documentos: os testes não correm."
              codigo=nao
            fi
          fi
          vps=sim
          r=0
          grep -qE '^(infra/|Dockerfile$|\.github/)' ficheiros.txt || r=$?
          if [ "$r" -eq 1 ]; then vps=nao; fi
          printf 'codigo=%s\nvps=%s\n' "$codigo" "$vps" >> "$GITHUB_OUTPUT"

  codigo:
    needs: alteracoes
    # Chamado pelo publicar, corre sempre (o alteracoes é saltado).
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.alteracoes.outputs.codigo != 'nao')) }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && vars.EXECUTOR_CI) || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    # As imagens base vêm da cópia no GHCR (#268) e, se faltar, do espelho
    # da Google (#263) ou do Docker Hub, sempre pelo mesmo resumo. O
    # PostgreSQL arranca num passo, e não em `services:`, para a origem ser
    # escolhida assim.
    permissions:
      contents: read
      packages: read
    env:
      BASE_DADOS_URL: postgres://postgres:verificar@127.0.0.1:5432/postgres
      EXIGIR_BASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: entrar no GHCR (as cópias das imagens base, #268)
        # Sem a entrada, o script abaixo cai para o espelho da Google.
        continue-on-error: true
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" |
            docker login ghcr.io -u "$ACTOR" --password-stdin
      - id: base
        name: imagens base (a cópia do GHCR; o espelho se faltar)
        env:
          DONO: ${{ github.repository_owner }}
        run: infra/ci/imagem-base.sh "${DONO,,}" postgres >> "$GITHUB_OUTPUT"
      - name: PostgreSQL 18.6
        # Palavra-passe de uma base descartável, que só existe durante o
        # fluxo e só ouve no executor: não é um segredo.
        env:
          IMAGEM: ${{ steps.base.outputs.postgres }}
        run: |
          docker run -d --name postgres -e POSTGRES_PASSWORD=verificar \
            -p 127.0.0.1:5432:5432 "$IMAGEM"
          for _ in $(seq 1 60); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1; then
              exit 0
            fi
            sleep 1
          done
          docker logs postgres
          exit 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm tipos
      - run: pnpm teste
      - run: pnpm construir

  script-vps:
    # O script da VPS (C3): shellcheck e o modo que só mostra numa máquina
    # Ubuntu 26.04 vazia. Não toca na VPS.
    needs: alteracoes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.alteracoes.outputs.vps != 'nao')) }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && vars.EXECUTOR_CI) || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: entrar no GHCR (as cópias das imagens base, #268)
        # Sem a entrada, o script abaixo cai para o espelho da Google.
        continue-on-error: true
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" |
            docker login ghcr.io -u "$ACTOR" --password-stdin
      - id: base
        name: imagens base (a cópia do GHCR; o espelho se faltar)
        env:
          DONO: ${{ github.repository_owner }}
        run: infra/ci/imagem-base.sh "${DONO,,}" ubuntu >> "$GITHUB_OUTPUT"
      - name: o node da lista é o do Dockerfile
        # O resumo está nos dois sítios (revisão do #269, P3-1).
        run: |
          lista="$(awk '$1 == "node" { print $2 }' infra/ci/imagens-base.txt)"
          docker="$(sed -n 's/^ARG NODE_IMAGEM=//p' Dockerfile)"
          if [ -z "$lista" ] || [ "${lista##*@}" != "${docker##*@}" ]; then
            echo "o resumo do node difere: lista ${lista##*@}, Dockerfile ${docker##*@}" >&2
            exit 1
          fi
      - name: o postgres da lista é o da VPS
        # O resumo está também no ensaio.conf (revisão do #308, P3-5).
        run: |
          lista="$(awk '$1 == "postgres" { print $2 }' infra/ci/imagens-base.txt)"
          vps="$(sed -n 's/^IMAGEM_POSTGRES=//p' infra/vps/ficheiros/ensaio.conf)"
          if [ -z "$lista" ] || [ -z "$vps" ] || [ "${lista##*@}" != "${vps##*@}" ]; then
            echo "o resumo do postgres difere: lista ${lista##*@}, ensaio.conf ${vps##*@}" >&2
            exit 1
          fi
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck -x -P SCRIPTDIR \
            infra/vps/preparar.sh \
            infra/vps/ficheiros/lib/comum.sh \
            infra/vps/ficheiros/bin/eurolify-pedido \
            infra/vps/ficheiros/sbin/eurolify-* \
            infra/vps/testes/*.sh \
            infra/ci/imagem-base.sh \
            infra/ci-executor/preparar.sh \
            infra/ci-executor/ficheiros/ganchos/*.sh \
            infra/ci-executor/ficheiros/sbin/*
      - name: testes do serviço da máquina num Ubuntu 26.04 vazio
        # Cada teste num contentor novo: não herdam o que o outro instalou.
        env:
          IMAGEM: ${{ steps.base.outputs.ubuntu }}
        run: |
          for teste in infra/vps/testes/*.sh; do
            echo "== $teste"
            docker run --rm -e EUROLIFY_TESTE_DESCARTAVEL=1 -v "$PWD:/repo:ro" \
              "$IMAGEM" bash "/repo/$teste"
          done
      - name: preparar.sh --mostrar num Ubuntu 26.04 vazio
        env:
          IMAGEM: ${{ steps.base.outputs.ubuntu }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            "$IMAGEM" bash /repo/infra/vps/preparar.sh --mostrar

  imagem:
    # Prova que o Dockerfile constrói; não envia nada para lado nenhum.
    needs: alteracoes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.alteracoes.outputs.codigo != 'nao' }}
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]' && vars.EXECUTOR_CI) || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: entrar no GHCR (as cópias das imagens base, #268)
        # Sem a entrada, o script abaixo cai para o espelho da Google.
        continue-on-error: true
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" |
            docker login ghcr.io -u "$ACTOR" --password-stdin
      - id: base
        name: imagens base (a cópia do GHCR; o espelho se faltar)
        env:
          DONO: ${{ github.repository_owner }}
        run: infra/ci/imagem-base.sh "${DONO,,}" buildkit node >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ steps.base.outputs.buildkit }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: NODE_IMAGEM=${{ steps.base.outputs.node }}
