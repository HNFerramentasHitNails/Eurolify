# Eurolify (infra/vps): o Hub de gestão por HTTPS (docs/22 §7). Os ecrãs são
# ficheiros estáticos que o eurolify-publicar copia da imagem para
# /var/lib/eurolify/hub/actual; só o /hub/ vai para a API (o resto da API
# continua sem porta aberta). O preparar.sh (passo 14) só liga este site com o
# certificado de hub.eurolify.eu.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.eurolify.eu;

    ssl_certificate     /etc/letsencrypt/live/hub.eurolify.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.eurolify.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 64k;

    # Cabeçalhos de segurança (revisão do #158, P3-8). O Hub não carrega nada
    # de outro domínio nem corre código inline; não abre dentro de outro site.
    # Um add_header numa location apagava estes: as locations usam «expires».
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    root /var/lib/eurolify/hub/actual;

    # A API do Hub. O IP de quem pede vai reescrito no X-Forwarded-For (o
    # cliente não o escolhe); a API confia nele só deste proxy, pelo gateway
    # da rede Docker (PROXY_CONFIAVEL, passo 14; revisão do #154, P1-1).
    # O nginx escolhe a location pelo caminho já descodificado e normalizado:
    # /products/a%2F..%2F..%2Fhub%2Fb entrava aqui e chegava cru à rota
    # /products da API (revisão do #160, P1-1, medido). Duas travas: o pedido
    # original tem de começar por /hub/, e o proxy_pass com caminho manda à
    # API o caminho normalizado, nunca o do cliente. Efeito: um %2F no caminho
    # chega à API como «/», por isso as rotas /hub/* nunca levam texto livre
    # num parâmetro do caminho (hoje só UUID; revisão do #162, P3-A).
    location /hub/ {
        if ($request_uri !~ "^/hub/") {
            return 404;
        }
        proxy_pass http://127.0.0.1:8080/hub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Os ficheiros com o resumo no nome nunca mudam.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # O index.html lê-se sempre outra vez: é ele que aponta para os ficheiros
    # de cada publicação.
    location = /index.html {
        expires -1;
    }

    # As páginas (/entrar, /convite, /equipa, /) são todas o index.html.
    location / {
        try_files $uri /index.html;
    }
}
