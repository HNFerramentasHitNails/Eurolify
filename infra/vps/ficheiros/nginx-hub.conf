# Eurolify (infra/vps): o Hub de gestão por HTTPS (docs/22 §7). Os ecrãs são
# ficheiros estáticos que o eurolify-publicar copia da imagem para
# /var/lib/eurolify/hub/actual; só o /hub/ e os avisos da Sendcloud (docs/36
# §17) vão para a API (o resto da API continua sem porta aberta). O
# preparar.sh (passo 14) só liga este site com o certificado de
# hub.eurolify.eu.

# Os avisos das transportadoras (docs/36 §17): um limite por IP, para quem
# os martela sem assinatura não ocupar a API.
limit_req_zone $binary_remote_addr zone=eurolify_avisos_envios:1m rate=60r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hub.eurolify.eu;

    ssl_certificate     /etc/letsencrypt/live/hub.eurolify.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.eurolify.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 64k;

    # Cabeçalhos de segurança (revisão do #158, P3-8). O Hub não carrega nada
    # de outro domínio nem corre código inline; não abre dentro de outro site.
    # Um add_header numa location apagava estes: as locations usam «expires».
    add_header Strict-Transport-Security "max-age=31536000" always;
    # img-src blob:: as imagens dos artigos chegam por fetch, com o cabeçalho
    # do comerciante, e mostram-se por um endereço blob: (docs/22 §12.1).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    root /var/lib/eurolify/hub/actual;

    # A API do Hub. O IP de quem pede vai reescrito no X-Forwarded-For (o
    # cliente não o escolhe); a API confia nele só deste proxy, pelo gateway
    # da rede Docker (PROXY_CONFIAVEL, passo 14; revisão do #154, P1-1).
    # O nginx escolhe a location pelo caminho já descodificado e normalizado:
    # /products/a%2F..%2F..%2Fhub%2Fb entrava aqui e chegava cru à rota
    # /products da API (revisão do #160, P1-1, medido). Duas travas: o pedido
    # original tem de começar por /hub/, e o proxy_pass com caminho manda à
    # API o caminho normalizado, nunca o do cliente. Efeito: um %2F no caminho
    # chega à API como «/», por isso as rotas /hub/* nunca levam texto livre
    # num parâmetro do caminho (hoje só UUID; revisão do #162, P3-A).
    location /hub/ {
        if ($request_uri !~ "^/hub/") {
            return 404;
        }
        proxy_pass http://127.0.0.1:8080/hub/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # O envio de uma imagem pelo Hub (docs/22 §15.3; issue #229): o único
    # caminho com corpos até 10 MB (o resto do site continua a 64 KB). Sem
    # guardar o corpo: o nginx passa os bytes à API à medida que chegam, e a
    # API recusa sem sessão, sem catalog:write ou acima de 2 envios do
    # comerciante antes de os ler. Assim a fotografia não deve ficar num
    # ficheiro temporário do nginx com os metadados (a API tira-os antes de
    # guardar): medido localmente a 09/10/2026, a medir no ensaio. Ligar o
    # http2 neste site ou passar o proxy a HTTP/1.0 pode voltar a guardar o
    # corpo em disco (revisão do #235, P3-10).
    # As mesmas travas da location /hub/ (o pedido original e o caminho
    # normalizado).
    location = /hub/media/uploads {
        if ($request_uri !~ "^/hub/media/uploads(\?|$)") {
            return 404;
        }
        client_max_body_size 10m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080/hub/media/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Os avisos da Sendcloud para uma conta (docs/36 §7.2 e §17; Diogo,
    # 13/10/2026): só este caminho, exacto, e só POST. A API confere a
    # assinatura (Sendcloud-Signature) e grava o aviso em bruto antes de o
    # tratar. As mesmas travas da /hub/: o pedido original tem de ter esta
    # forma (sem consulta), e à API vai o caminho já normalizado, que a
    # expressão garante ser só letras, algarismos e hífenes.
    location ~ "^/webhooks/carriers/sendcloud/cac_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        if ($request_uri !~ "^/webhooks/carriers/sendcloud/cac_[0-9a-f-]{36}$") {
            return 404;
        }
        limit_except POST {
            deny all;
        }
        limit_req zone=eurolify_avisos_envios burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # O resto de /webhooks/ (outras transportadoras, os pagamentos) não está
    # publicado: 404, e não o index.html do Hub.
    location /webhooks/ {
        return 404;
    }

    # Os ficheiros com o resumo no nome nunca mudam.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # O index.html lê-se sempre outra vez: é ele que aponta para os ficheiros
    # de cada publicação.
    location = /index.html {
        expires -1;
    }

    # As páginas (/entrar, /convite, /equipa, /) são todas o index.html.
    location / {
        try_files $uri /index.html;
    }
}
