# Configuração do ensaio sem segredos (infra/vps). Instalado em
# /etc/eurolify/ensaio.conf. Os segredos ficam em ficheiros próprios em
# /etc/eurolify/, só para o root, postos na Fase D — nunca aqui.

# Imagem da API no GHCR (ADR-0026); só o resumo chega pelo fluxo de publicar.
IMAGEM_REPO=ghcr.io/hnferramentashitnails/eurolify-api
GHCR_UTILIZADOR=HNFerramentasHitNails

# Repositório que o fluxo de aplicar o script vai buscar (ADR-0028).
REPOSITORIO_GIT=git@github.com:HNFerramentasHitNails/Eurolify.git

# PostgreSQL 18, fixado pelo mesmo resumo do fluxo verificar (ADR-0025).
IMAGEM_POSTGRES=postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
BASE_NOME=eurolify

# Destino das cópias no rclone: <remoto>:<contentor>/<pasta> (ADR-0027).
# O remoto «ovh» (OVH Object Storage, Paris em três zonas, ADR-0032) define-se em
# /etc/eurolify/rclone.conf.
S3_DESTINO=ovh:eurolify-ensaio-copias/ensaio

# MCP da VPS (ADR-0033): endereço público, contas que entram e o intervalo de
# onde a Anthropic liga (claude.com/docs/connectors/building, 04/10/2026).
MCP_DOMINIO=mcp.eurolify.eu
MCP_URL=https://mcp.eurolify.eu
# Contas pelo número no GitHub (`gh api users/<nome> --jq .id`), não pelo nome:
# um nome pode mudar e ficar livre para outro (revisão do #30).
# 259400126 = HNFerramentasHitNails; 176623429 = bruno-88 (lidos a 04/10/2026).
MCP_CONTAS=259400126,176623429
# O intervalo da Anthropic (160.79.104.0/21) está no nginx-mcp.conf: a 443
# abre a todos, porque o login passa pelo browser (revisão do #30).

# Hub de gestão (docs/22 §7): os ecrãs e a API do Hub em https://hub.eurolify.eu.
# O registo A na zona da OVH cria-o o Diogo ou o Bruno; sem ele (e sem
# certificado), o site e as rotas do Hub ficam desligados.
HUB_DOMINIO=hub.eurolify.eu
