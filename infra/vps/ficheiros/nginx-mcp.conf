# Eurolify (infra/vps): o MCP da VPS por HTTPS (ADR-0033). A 443 está aberta a
# todos na firewall, porque o login abre no browser de quem liga o connector;
# aqui só o login fica aberto, e tudo o resto só para o intervalo da Anthropic.

# Limite por endereço para as páginas abertas (o login).
limit_req_zone $binary_remote_addr zone=eurolify_mcp_login:1m rate=10r/m;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/mcp.eurolify.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.eurolify.eu/privkey.pem;
    # Outro nome que não o do MCP: fecha a ligação sem responder.
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.eurolify.eu;

    ssl_certificate     /etc/letsencrypt/live/mcp.eurolify.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.eurolify.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    # Abertas a todos: o browser de quem liga o connector passa por aqui
    # (o pedido de login e o regresso do GitHub). Com limite de pedidos.
    location = /authorize {
        limit_req zone=eurolify_mcp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }
    location = /oauth/github/callback {
        limit_req zone=eurolify_mcp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
    }

    # Tudo o resto (o /mcp, o /token, o /register, os metadados): só a
    # Anthropic (claude.com/docs/connectors/building, 04/10/2026).
    location / {
        allow 160.79.104.0/21;
        deny all;
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
