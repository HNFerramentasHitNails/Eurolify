# Eurolify (infra/vps): o MCP da VPS por HTTPS (ADR-0033). A firewall só deixa
# chegar aqui o intervalo da Anthropic; o nginx só serve este nome.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/mcp.eurolify.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.eurolify.eu/privkey.pem;
    # Outro nome que não o do MCP: fecha a ligação sem responder.
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.eurolify.eu;

    ssl_certificate     /etc/letsencrypt/live/mcp.eurolify.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.eurolify.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
