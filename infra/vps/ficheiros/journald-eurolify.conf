# Eurolify (infra/vps). Os registos guardam endereços IP, que são dados
# pessoais: 14 dias (ADR-0018, ADR-0027).
# Também o número e o login da conta dos operadores (Diogo, 05/10/2026).
# O journald só apaga ficheiros inteiros já fechados: um ficheiro por dia
# faz os 14 dias valerem ao dia (revisão do #102, P1-1).
[Journal]
MaxRetentionSec=14day
MaxFileSec=1day
