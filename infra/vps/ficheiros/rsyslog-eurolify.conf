# Eurolify (infra/vps). As linhas do registo de acções (logger -t eurolify,
# comum.sh) e do contentor do MCP (etiqueta eurolify-mcp) levam o número e o
# login da conta dos operadores: ficam só no diário do sistema (14 dias) e no
# acoes.log (14 dias), não no /var/log/syslog, que roda ao fim de semanas
# (Diogo, 05/10/2026: «14 dias, como os IP»; revisão do #102, P1-2).
if $programname == 'eurolify' or $programname == 'eurolify-mcp' then stop
